services:
  db:
    image: postgres:16
    container_name: familieappen-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: familieappen
      POSTGRES_USER: familieappen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - familieappen_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    container_name: familieappen-api
    restart: unless-stopped
    depends_on:
      - db
    volumes:
      - familieappen_uploads:/app/uploads
    environment:
      NODE_ENV: production
      PORT: 4000
      API_PREFIX: api
      DATABASE_URL: postgresql://familieappen:${POSTGRES_PASSWORD}@db:5432/familieappen?schema=public
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET}
      ADMIN_SESSION_TTL: ${ADMIN_SESSION_TTL:-604800}
      ADMIN_COOKIE_DOMAIN: ${ADMIN_COOKIE_DOMAIN}
      CORS_ORIGINS: https://familieappen.martila.no, https://api-familieappen.martila.no, http://192.168.1.231:3000, http://localhost:3000
      EMAIL_PROVIDER: ${EMAIL_PROVIDER}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS}
      APP_BASE_URL: ${APP_BASE_URL}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL}
      PUBLIC_API_URL: ${PUBLIC_API_URL}
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: https://api-familieappen.martila.no/api
    container_name: familieappen-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://api-familieappen.martila.no/api
    ports:
      - "3000:3000"

volumes:
  familieappen_pgdata:
  familieappen_uploads: